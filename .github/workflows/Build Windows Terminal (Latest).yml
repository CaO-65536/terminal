
name: Build Windows Terminal

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Checkout current repository (including your modifications)
    - name: Checkout Windows Terminal source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. Initialize MSBuild
    - name: Initialize MSBuild
      uses: microsoft/setup-msbuild@v3

    # 3. Initialize NuGet
    - name: Initialize NuGet
      uses: nuget/setup-nuget@v3

    # 4. Configure vcpkg
    - name: Configure vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: 'vcpkg.json'

    # 5. Restore solution NuGet dependencies
    - name: Restore solution NuGet packages
      shell: pwsh
      run: |
        nuget restore .\OpenConsole.slnx `
          -NonInteractive `
          -Verbosity normal

        if ($LASTEXITCODE -ne 0) {
          throw "Solution NuGet restore failed!"
        }

    # 6. Restore centralized native NuGet dependencies
    - name: Restore native NuGet packages
      shell: pwsh
      run: |
        nuget restore .\dep\nuget\packages.config `
          -PackagesDirectory .\packages `
          -NonInteractive `
          -Verbosity normal

        if ($LASTEXITCODE -ne 0) {
          throw "Native NuGet restore failed!"
        }

        $wil = ".\packages\Microsoft.Windows.ImplementationLibrary.1.0.250325.1\build\native\Microsoft.Windows.ImplementationLibrary.targets"

        if (!(Test-Path $wil)) {
          throw "WIL package is still missing!"
        }

        Write-Host "WIL package restored successfully!"

    # 7. Initialize official build environment
    - name: Initialize Windows Terminal build environment
      shell: pwsh
      run: |
        Import-Module .\tools\OpenConsole.psm1
        Set-MsBuildDevEnvironment

    # 8. Build Windows Terminal MSIX
    - name: Build Windows Terminal MSIX
      shell: pwsh
      run: |
        $msbuild = (Get-Command MSBuild.exe -ErrorAction Stop).Source

        & $msbuild .\OpenConsole.slnx `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:AppxSymbolPackageEnabled=false `
          /t:Terminal\CascadiaPackage `
          /m

        if ($LASTEXITCODE -ne 0) {
          throw "Windows Terminal packaging failed!"
        }

    # 9. Verify generated packages
    - name: Verify generated packages
      shell: pwsh
      run: |
        $path = ".\src\cascadia\CascadiaPackage\AppPackages"

        if (!(Test-Path $path)) {
          throw "AppPackages directory not found!"
        }

        $files = Get-ChildItem $path -Recurse -File

        $files | Select-Object FullName, Length

        $packages = $files | Where-Object {
          $_.Extension -in @(".msix", ".msixbundle")
        }

        if (!$packages) {
          throw "No MSIX packages were generated!"
        }

        Write-Host "Found $($packages.Count) MSIX package(s)."

    # 10. Upload Windows Terminal packages
    - name: Upload Windows Terminal MSIX
      uses: actions/upload-artifact@v4
      with:
        name: WindowsTerminal-Release-x64
        path: src/cascadia/CascadiaPackage/AppPackages/**
        if-no-files-found: error
        compression-level: 6
        retention-days: 14
