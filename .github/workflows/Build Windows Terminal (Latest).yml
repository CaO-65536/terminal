
name: Build Windows Terminal

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout source
      - name: Checkout Windows Terminal source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # 2. Initialize MSBuild
      - name: Initialize MSBuild
        uses: microsoft/setup-msbuild@v3

      # 3. Initialize NuGet
      - name: Initialize NuGet
        uses: nuget/setup-nuget@v3

      # 4. Configure vcpkg
      - name: Configure vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      # 5. Restore dependencies and build Windows Terminal
      - name: Restore dependencies and build Windows Terminal
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $logDir = ".\artifacts\logs"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          $transcriptLog = Join-Path $logDir "workflow-transcript.log"
          $consoleLog = Join-Path $logDir "msbuild-console.log"
          $diagnosticLog = Join-Path $logDir "msbuild-diagnostic.log"
          $binaryLog = Join-Path $logDir "msbuild.binlog"

          Start-Transcript -Path $transcriptLog -Force

          try {
            Write-Host "========================================"
            Write-Host " Windows Terminal Build Environment"
            Write-Host "========================================"

            # Restore solution NuGet dependencies
            Write-Host "`n[1/4] Restoring solution NuGet packages..."

            & nuget restore .\OpenConsole.slnx `
              -NonInteractive `
              -Verbosity detailed

            if ($LASTEXITCODE -ne 0) {
              throw "Solution NuGet restore failed! Exit code: $LASTEXITCODE"
            }

            # Restore centralized native NuGet dependencies
            Write-Host "`n[2/4] Restoring native NuGet packages..."

            & nuget restore .\dep\nuget\packages.config `
              -PackagesDirectory .\packages `
              -NonInteractive `
              -Verbosity detailed

            if ($LASTEXITCODE -ne 0) {
              throw "Native NuGet restore failed! Exit code: $LASTEXITCODE"
            }

            # Verify WIL
            $wil = ".\packages\Microsoft.Windows.ImplementationLibrary.1.0.250325.1\build\native\Microsoft.Windows.ImplementationLibrary.targets"

            if (!(Test-Path $wil)) {
              throw "WIL package is missing: $wil"
            }

            Write-Host "WIL package restored successfully!"

            # Initialize official build environment.
            # IMPORTANT: This must run in the SAME step as MSBuild.
            Write-Host "`n[3/4] Initializing Windows Terminal build environment..."

            Import-Module .\tools\OpenConsole.psm1 -Force
            Set-MsBuildDevEnvironment

            $msbuild = (Get-Command MSBuild.exe -ErrorAction Stop).Source

            Write-Host "MSBuild: $msbuild"
            Write-Host "Configuration: Release"
            Write-Host "Platform: x64"

            # Build Windows Terminal MSIX
            Write-Host "`n[4/4] Building Windows Terminal MSIX..."

            $msbuildArgs = @(
              ".\OpenConsole.slnx"
              "/p:Configuration=Release"
              "/p:Platform=x64"
              "/p:AppxSymbolPackageEnabled=false"
              "/t:Terminal\CascadiaPackage"
              "/m"
              "/v:diag"
              "/nologo"
              "/fl"
              "/flp:logfile=$diagnosticLog;verbosity=diagnostic"
              "/bl:$binaryLog"
            )

            Write-Host "`n========================================"
            Write-Host " MSBuild Full Diagnostic Output"
            Write-Host "========================================"

            & $msbuild @msbuildArgs 2>&1 |
              Tee-Object -FilePath $consoleLog

            $buildExitCode = $LASTEXITCODE

            Write-Host "`n========================================"
            Write-Host " Build Exit Code: $buildExitCode"
            Write-Host "========================================"

            if ($buildExitCode -ne 0) {
              throw "Windows Terminal packaging failed! Exit code: $buildExitCode. Check MSBuild diagnostic logs and binary log."
            }

            Write-Host "`nWindows Terminal build completed successfully!"
          }
          finally {
            Stop-Transcript
          }

      # 6. Verify generated packages
      - name: Verify generated packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $path = ".\src\cascadia\CascadiaPackage\AppPackages"

          if (!(Test-Path $path)) {
            throw "AppPackages directory not found!"
          }

          $files = Get-ChildItem $path -Recurse -File

          $files | Select-Object FullName, Length | Format-Table -AutoSize

          $packages = $files | Where-Object {
            $_.Extension -in @(".msix", ".msixbundle")
          }

          if (!$packages) {
            throw "No MSIX packages were generated!"
          }

          Write-Host "Found $($packages.Count) MSIX package(s)."

      # 7. Upload diagnostic logs, even if the build fails
      - name: Upload complete build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WindowsTerminal-Build-Logs
          path: artifacts/logs/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30

      # 8. Upload generated MSIX packages
      - name: Upload Windows Terminal packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WindowsTerminal-Release-x64
          path: src/cascadia/CascadiaPackage/AppPackages/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
