name: Build Windows Terminal

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. 检出 Windows Terminal 源码
      uses: actions/checkout@v4
      with:
        repository: 'microsoft/terminal'
        submodules: recursive

    - name: 2. 初始化 MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: 3. 初始化 NuGet
      uses: nuget/setup-nuget@v3

    - name: 4. 配置并运行 vcpkg (含自动缓存)
      uses: lukka/run-vcpkg@v11
      with:
        # 修复参数：使用 vcpkgJsonGlob 代替过时的 vcpkgJsonPath
        vcpkgJsonGlob: 'vcpkg.json'
        # 默认情况下 lukka/run-vcpkg 已经内置了基于 GitHub Actions Cache 的二进制缓存机制

    - name: 5. 使用 PowerShell 官方脚本构建
      shell: pwsh
      run: |
        Write-Host "导入 OpenConsole 构建模块..."
        Import-Module .\tools\OpenConsole.psm1
        
        Write-Host "配置 MSBuild 开发者环境变量..."
        Set-MsBuildDevEnvironment
        
        Write-Host "开始编译 OpenConsole.slnx..."
        Invoke-OpenConsoleBuild
